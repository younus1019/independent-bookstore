<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Pagely Bookstore</title>

  <link rel="icon" type="image/png" href="images/logo for website.jpg">

  <link rel="stylesheet" href="signup.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>

function toggleRTL(){

  if(document.body.style.direction === "rtl"){

    document.body.style.direction = "ltr";

  }

  else{

    document.body.style.direction = "rtl";

  }

}

</script>
</head>

<body>

  <div class="top-actions">
    <button class="rtl-btn" onclick="toggleRTL()">
  RTL
</button>
    <button class="mode-btn">
      <i data-lucide="moon"></i>
    </button>
  </div>

  <main class="signup-wrapper">

    <section class="signup-card">

      <div class="brand">
        <img src="images/logo for website.jpg" alt="Logo">
        <h1>Pagely <span>Bookstore</span></h1>
      </div>

      <p class="intro">
        Create your reader profile to explore books, reserve reading lounge seats,
        order online, and track your library history.
      </p>

      <form>

        <div class="form-section-title">
          <h2>Account Information</h2>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" placeholder="Jane" required>
          </div>

          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" placeholder="jane@domain.com" required>
        </div>

        <div class="form-row">
          <div class="form-group password-box">
            <label>Password *</label>
            <input type="password" placeholder="••••••••" required>
            <i data-lucide="eye"></i>
          </div>

          <div class="form-group password-box">
            <label>Confirm Password *</label>
            <input type="password" placeholder="••••••••" required>
            <i data-lucide="eye"></i>
          </div>
        </div>

        <label class="terms-box">
          <input type="checkbox" required>
          <span>
            I confirm that all provided information is accurate, and I agree to the
            <a href="#">Pagely Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </span>
        </label>

        <button class="submit-btn" type="submit">
          Complete Registration
        </button>

      </form>

      <p class="login-text">
        Already part of Pagely?
        <a href="login.html">Log in here</a>
      </p>

    </section>

  </main>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
