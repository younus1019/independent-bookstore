<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="bg"></div>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="logo">
  <img src="images/logo for website.jpg" alt="logo">
  <span>paely bookstore</span>
</div>

      <p class="subtitle">Join the Guild. Log in to your account.</p>

      <!-- FORM -->
      <form>

        <label>Email Address</label>
        <input type="email" placeholder="player@domain.com" required>

        <label>Password</label>
        <input type="password" placeholder="••••••••" required>

        <div class="options">
          <label>
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="login-btn">Login to Account</button>

        <div class="divider">or continue with</div>

        <button class="google-btn">G Continue with Google</button>
        <button class="apple-btn"> Continue with Apple</button>

        <p class="signup">
          Not in the guild yet? <a href="#">Sign up</a>
        </p>

      </form>

    </div>

  </div>

</body>
</html>
